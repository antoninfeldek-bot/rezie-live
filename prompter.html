<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Režie Live – čtečka</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:absolute;inset:0;overflow:hidden}
  #wrap.mirror{transform:scaleX(-1)}
  #txt{padding:45vh 8vw 60vh;white-space:pre-wrap;font-weight:600;line-height:1.35;will-change:transform}
  #line{position:fixed;left:0;right:0;top:45vh;border-top:3px solid rgba(255,40,40,.65);pointer-events:none}
  #arrow{position:fixed;left:1.5vw;top:calc(45vh - 22px);color:#f33;font-size:40px;pointer-events:none}
  #bar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;background:rgba(20,22,28,.92);border:1px solid #333;border-radius:14px;padding:8px;transition:opacity .3s;z-index:5}
  #bar.hide{opacity:0;pointer-events:none}
  #bar button{font:inherit;font-size:17px;color:#fff;background:#262a33;border:1px solid #3a3f4a;border-radius:10px;padding:10px 14px}
  #bar button.on{background:#1e3a8a;border-color:#3b82f6}
  #st{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));font-size:13px;color:#888;z-index:5}
  #st.off{color:#f87171}
  #msg{position:fixed;left:16px;right:16px;top:40%;text-align:center;font-size:22px;color:#fca5a5;z-index:6}
</style>
</head>
<body>
<div id="wrap"><div id="txt"></div></div>
<div id="line"></div><div id="arrow">▶</div>
<div id="st">●</div>
<div id="bar" class="hide">
  <button id="bMir">⇋ <span data-t>Zrcadlit</span>: <b id="mirV"></b></button>
  <button id="bSm">A−</button><button id="bBg">A+</button>
  <button id="bFull">⛶</button>
</div>
<div id="msg" hidden></div>
<script src="js/prompter-client.js"></script>
</body>
</html>
