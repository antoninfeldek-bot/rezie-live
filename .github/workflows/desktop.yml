name: Desktop app (Mac + Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['electron/**', 'js/**', 'css/**', '*.html', 'server.js', 'package.json', '.github/workflows/desktop.yml']
permissions:
  contents: write
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version number = release number
        run: npm pkg set version=1.0.${{ github.run_number }}
      - name: Install (FFmpeg for ${{ matrix.arch }})
        run: npm install --no-audit --no-fund
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Check bundled FFmpeg
        run: file node_modules/ffmpeg-static/ffmpeg
      - name: Bundle cloudflared (guests over the internet)
        run: |
          A=${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}
          mkdir -p bin && curl -fsSL -o cf.tgz "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-$A.tgz"
          tar -xzf cf.tgz -C bin && chmod +x bin/cloudflared && file bin/cloudflared && bin/cloudflared --version || true
      - name: Build NDI helper (loads the user's NDI runtime at run time)
        run: |
          A=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          mkdir -p bin && clang -O2 -arch $A -mmacosx-version-min=11.0 -o bin/ndi-send electron/ndi/ndi-send.c
          clang -O2 -arch $A -mmacosx-version-min=11.0 -o bin/ndi-recv electron/ndi/ndi-recv.c
          codesign --force --sign - bin/ndi-send && codesign --force --sign - bin/ndi-recv && file bin/ndi-send bin/ndi-recv
      - name: Build app
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never
      - name: Ad-hoc sign + DMG
        run: |
          APP=$(ls -d dist/mac*/*.app | head -1)
          echo "App: $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          mkdir -p out
          STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Rezie Live" -srcfolder "$STAGE" -ov -format UDZO "out/Rezie-Live-mac-${{ matrix.arch }}.dmg"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Rezie-Live-mac-${{ matrix.arch }}
          path: out/*.dmg
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Režie Live ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            **Mac s čipem M1/M2/M3/M4 (Apple Silicon):** stáhni `Rezie-Live-mac-arm64.dmg`
            **Starší Mac s Intelem:** stáhni `Rezie-Live-mac-x64.dmg`
            **Windows 10/11 (64bit):** stáhni `Rezie-Live-windows-x64-setup.exe`

            **Mac:** otevři .dmg a přetáhni Rezie Live do Aplikací. Při prvním spuštění: Nastavení systému → Soukromí a zabezpečení → „Přesto otevřít“.
            **Windows:** spusť instalátor. Když se objeví „Systém Windows ochránil váš počítač“, klikni na „Další informace“ → „Přesto spustit“.
            Podrobně v NAVOD.md.

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version number = release number
        run: npm pkg set version=1.0.${{ github.run_number }}
      - name: Install (FFmpeg for Windows)
        run: npm install --no-audit --no-fund
      - name: Check bundled FFmpeg
        run: ls -la node_modules/ffmpeg-static/ && node_modules/ffmpeg-static/ffmpeg.exe -hide_banner -version | head -1
      - name: Bundle cloudflared (guests over the internet)
        run: |
          mkdir -p bin && curl -fsSL -o bin/cloudflared.exe "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          bin/cloudflared.exe --version || true
      - name: Build NDI helper (loads the user's NDI runtime at run time)
        continue-on-error: true
        run: |
          mkdir -p bin
          (gcc -O2 -static -o bin/ndi-send.exe electron/ndi/ndi-send.c || clang -O2 -o bin/ndi-send.exe electron/ndi/ndi-send.c) && ls -la bin/ndi-send.exe
          (gcc -O2 -static -o bin/ndi-recv.exe electron/ndi/ndi-recv.c || clang -O2 -o bin/ndi-recv.exe electron/ndi/ndi-recv.c) && ls -la bin/ndi-recv.exe
          ./bin/ndi-recv.exe --find || true
          ./bin/ndi-send.exe "test" 64 64 30 1 48000 < /dev/null || true
      - name: Build app
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect installer
        run: |
          ls -la dist
          mkdir -p out && cp "$(ls dist/*.exe | head -1)" out/Rezie-Live-windows-x64-setup.exe && ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Rezie-Live-windows-x64
          path: out/*.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Režie Live ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            **Mac s čipem M1/M2/M3/M4 (Apple Silicon):** stáhni `Rezie-Live-mac-arm64.dmg`
            **Starší Mac s Intelem:** stáhni `Rezie-Live-mac-x64.dmg`
            **Windows 10/11 (64bit):** stáhni `Rezie-Live-windows-x64-setup.exe`

            **Mac:** otevři .dmg a přetáhni Rezie Live do Aplikací. Při prvním spuštění: Nastavení systému → Soukromí a zabezpečení → „Přesto otevřít“.
            **Windows:** spusť instalátor. Když se objeví „Systém Windows ochránil váš počítač“, klikni na „Další informace“ → „Přesto spustit“.
            Podrobně v NAVOD.md.
